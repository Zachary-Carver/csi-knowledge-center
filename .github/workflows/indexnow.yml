name: Notify IndexNow

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Build IndexNow payload
        shell: bash
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          host = "answers.cleansceneinvestigators.com"
          base = f"https://{host}"
          key = "06bd6b9234f3f250e073093b3b08ee29"
          key_location = f"{base}/{key}.txt"

          # Always submit the complete public authority surface. The earlier
          # changed-files-only logic could miss pages that existed before the
          # IndexNow workflow was added, including the Denton authority page.
          urls = {
              f"{base}/",
              f"{base}/sitemap.xml",
              f"{base}/robots.txt",
              f"{base}/business.jsonld",
              f"{base}/llms.txt",
              f"{base}/llms-full.txt",
          }

          try:
              root = ET.parse("sitemap.xml").getroot()
              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
              for loc in root.findall(".//sm:loc", ns):
                  if loc.text:
                      url = loc.text.strip()
                      if url.startswith(base):
                          urls.add(url)
          except Exception as exc:
              print(f"Could not parse sitemap.xml: {exc}")

          payload = {
              "host": host,
              "key": key,
              "keyLocation": key_location,
              "urlList": sorted(urls),
          }
          with open("indexnow-payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          print(json.dumps(payload, indent=2))
          PY

      - name: Submit CSI authority URLs to IndexNow
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json
