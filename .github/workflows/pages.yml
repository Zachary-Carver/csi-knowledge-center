name: Deploy CSI Knowledge Center

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sync exact CSI primary-page registry from live GoDaddy sitemap
        run: python scripts/sync-main-site-authority.py

      - name: Verify live authority registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("canonical-main-site-pages.json").read_text(encoding="utf-8"))
          primary = data["primaryPageCount"]
          observed = data["observedSitemapUrlCount"]
          excluded = data["excludedFromPrimaryArchitecture"]
          print(f"Current CSI primary pages: {primary}")
          print(f"Live sitemap URLs observed: {observed}")
          print(f"Supporting/blog/system routes: {len(excluded)}")
          if primary < 30:
              raise SystemExit(f"Authority registry unexpectedly small: {primary}")
          if not Path("canonical-main-site-pages/index.html").exists():
              raise SystemExit("Generated canonical-page HTML index is missing")
          PY

      - name: Inject CSI shield branding and cache-bust visual assets
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["BUILD_SHA"][:12]
          logo = f'/assets/csi-shield-logo.svg?v={version}'
          css = f'/assets/style.css?v={version}'

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')

              text = re.sub(r'/assets/style\.css(?:\?v=[^"\']+)?', css, text)

              if 'class="brand"' in text and 'class="brand-logo"' not in text:
                  text = re.sub(
                      r'(<a class="brand"[^>]*>)',
                      r'\1<img class="brand-logo" src="' + logo + r'" alt="CSI: Clean Scene Investigators shield logo" width="50" height="50">',
                      text,
                      count=1,
                  )

              if '<section class="hero"><div class="wrap">' in text and 'class="hero-logo"' not in text:
                  text = text.replace(
                      '<section class="hero"><div class="wrap">',
                      '<section class="hero"><div class="wrap"><img class="hero-logo" src="' + logo + '" alt="CSI: Clean Scene Investigators shield logo" width="300" height="300">',
                      1,
                  )

              path.write_text(text, encoding='utf-8')

          print(f'Applied CSI shield branding with cache version {version}')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
