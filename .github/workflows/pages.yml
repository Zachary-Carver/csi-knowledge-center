name: Deploy CSI Knowledge Center

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sync exact CSI primary-page registry from live GoDaddy sitemap
        run: python scripts/sync-main-site-authority.py

      - name: Verify designed 50-page authority registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("canonical-main-site-pages.json").read_text(encoding="utf-8"))
          primary = data["primaryPageCount"]
          observed = data["observedSitemapUrlCount"]
          excluded = data["excludedFromPrimaryArchitecture"]
          print(f"Designed CSI primary pages: {primary}")
          print(f"Live sitemap URLs observed: {observed}")
          print(f"Non-primary/system routes excluded: {len(excluded)}")
          if primary != 50:
              raise SystemExit(f"Expected exactly 50 designed primary authority pages, found {primary}")
          if not Path("canonical-main-site-pages/index.html").exists():
              raise SystemExit("Generated canonical-page HTML index is missing")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
